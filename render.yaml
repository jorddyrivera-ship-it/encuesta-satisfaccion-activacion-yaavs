services:
  - type: web
    name: encuesta-satisfaccion-activacion-yaavs
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: RESET_KEY
        value: yaavs-reset
      - key: SHEETS_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbzL1Te35LzXBhPpZYUz1vP0x7bhFUti63pUOM5BG7FNIEFl2E9k5VpTXNl4y1lBWnzp5A/exec
